# يبني تطبيق «سنا الآي» للأندرويد (نافذة تعرض الموقع مباشرة) ويضعه في صفحة التحميل:
# https://github.com/Rehab1Sama/Aheeeer/releases/latest/download/sana-alay.apk
name: تطبيق الأندرويد

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: بناء التطبيق
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease
      - name: تجهيز الملف
        run: cp android/app/build/outputs/apk/release/app-release.apk sana-alay.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-app
          name: تطبيق سنا الآي للأندرويد
          body: |
            تطبيق «سنا الآي» للأندرويد. حمّلي ملف sana-alay.apk ثم اضغطيه للتثبيت.
            التطبيق يعرض موقع المقرأة مباشرة، فكل تحديث في الموقع يظهر فيه فورًا.
          files: sana-alay.apk
          make_latest: true
