# فحص تلقائي لكل تعديل: اختبارات قواعد المقرأة + فحص الأنواع (TypeScript) + بناء الموقع.
# Render ينشر كل دفعة تلقائيًا؛ هذا الفحص يُظهر علامة حمراء على الدفعة إن كسرت شيئًا.
name: الفحص التلقائي

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: اختبارات القواعد
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server run test

  typecheck:
    name: فحص الأنواع والبناء
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: فحص الأنواع
        run: pnpm run typecheck
      - name: بناء الموقع
        run: BASE_PATH=/ pnpm --filter @workspace/sana-quran run build && pnpm --filter @workspace/api-server run build
      - name: فحص إقلاع الخادم (أخطاء التحميل تُكتشف قبل النشر)
        run: |
          set +e
          PORT=18080 NODE_ENV=production DATABASE_URL=postgres://u:p@127.0.0.1:1/x SUPABASE_DATABASE_URL=postgres://u:p@127.0.0.1:1/x SESSION_SECRET=ci \
            timeout 20 node artifacts/api-server/dist/index.mjs > boot.log 2>&1
          cat boot.log | tail -40
          if grep -Eq "is not a constructor|is not a function|SyntaxError|ReferenceError|Cannot find (module|package)|ERR_MODULE_NOT_FOUND" boot.log; then
            echo "::error::الخادم يتعطل عند الإقلاع — لن ينجح النشر على Render"; exit 1
          fi
          exit 0
