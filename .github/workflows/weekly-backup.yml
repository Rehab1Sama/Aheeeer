# نسخة احتياطية أسبوعية لقاعدة البيانات (كل جمعة ٣ فجرًا بتوقيت مكة)، مشفّرة بكلمة سر،
# تُحفظ ٩٠ يومًا في تبويب Actions. لا تُفتح إلا بكلمة السر (BACKUP_PASSPHRASE).
#
# الإعداد مرة واحدة (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL  رابط قاعدة البيانات (رابط Session أو Direct من Supabase، منفذ 5432)
#   BACKUP_PASSPHRASE    كلمة سر طويلة تحفظينها عندكِ — بدونها لا يمكن فتح النسخة
#
# الاسترجاع: نزّلي الملف من صفحة التشغيل ثم:
#   gpg --decrypt sana-backup-*.sql.gz.gpg | gunzip > backup.sql
name: النسخ الاحتياطي الأسبوعي

on:
  schedule:
    - cron: "0 0 * * 5"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: تثبيت أدوات PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: أخذ النسخة وتشفيرها
        env:
          DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then echo "أضيفي BACKUP_DATABASE_URL و BACKUP_PASSPHRASE في أسرار المستودع"; exit 1; fi
          STAMP=$(TZ=Asia/Riyadh date +%Y-%m-%d)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --no-owner --no-privileges --schema=public \
            | gzip -9 \
            | gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 \
                -o "sana-backup-$STAMP.sql.gz.gpg"
          ls -lh sana-backup-*.gpg
          # تحقق: النسخة تُفك وفيها جداول
          gpg --batch --pinentry-mode loopback --passphrase "$PASS" --decrypt "sana-backup-$STAMP.sql.gz.gpg" 2>/dev/null | gunzip | grep -c "CREATE TABLE" | xargs -I{} sh -c 'test {} -gt 10 && echo "جداول في النسخة: {}"'

      - uses: actions/upload-artifact@v4
        with:
          name: sana-backup-${{ env.STAMP }}
          path: sana-backup-*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
